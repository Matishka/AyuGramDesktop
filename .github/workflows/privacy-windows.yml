name: Privacy Edition Windows compile check
on:
  push:
    branches: ['feat/profile-privacy']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Ensure MSVC 14.44 ATL and MFC components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio C++ installation not found' }
          $components = @('Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC')
          $withComponents = & $vswhere -latest -products '*' -requires $components -property installationPath | Select-Object -First 1
          if ($withComponents -ne $vs) {
            $setup = Join-Path $installer 'setup.exe'
            if (!(Test-Path $setup)) { throw 'Visual Studio installer setup.exe not found' }
            $arguments = "modify --installPath `"$vs`" --add $($components[0]) --add $($components[1]) --quiet --norestart"
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "Visual Studio component installation failed: $($process.ExitCode)" }
          }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Verify the exact selected toolset, not just the newest VS headers.
          @'
          #include <atlbase.h>
          #include <atlcomcli.h>
          #include <afxwin.h>
          int main() { return 0; }
          '@ | Set-Content -LiteralPath atl-mfc-check.cpp -Encoding ascii
          $script = @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44 || exit /b 1
          cl /nologo /c /EHsc /MT atl-mfc-check.cpp || exit /b 1
          "@
          Set-Content -LiteralPath atl-mfc-check.cmd -Value $script -Encoding ascii
          cmd.exe /d /c atl-mfc-check.cmd
          if ($LASTEXITCODE -ne 0) { throw 'MSVC 14.44 ATL/MFC header compilation failed' }
          Write-Host 'MSVC 14.44 ATL/MFC preflight passed.'
      - name: Increase Windows virtual memory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory | Format-List
          Get-CimInstance Win32_PageFileUsage | Format-Table Name,AllocatedBaseSize,CurrentUsage,PeakUsage
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Format-Table DeviceID,Size,FreeSpace
          # Prefer the OS volume to preserve workspace disk space for Qt and object files.
          $drive = $env:SystemDrive
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$drive'"
          $name = "$drive\pagefile.sys"
          $usage = Get-CimInstance Win32_PageFileUsage | Where-Object Name -eq $name | Select-Object -First 1
          $existingMB = if ($usage) { [int]$usage.AllocatedBaseSize } else { 0 }
          $maxMB = [int][Math]::Min(32768, [Math]::Floor($disk.FreeSpace / 1MB) + $existingMB - 12288)
          if ($maxMB -ge 16384) {
            try {
              $computer = Get-CimInstance Win32_ComputerSystem
              Set-CimInstance -InputObject $computer -Property @{AutomaticManagedPagefile=$false} | Out-Null
              $initialMB = [int][Math]::Min($maxMB,24576)
              $setting = Get-CimInstance Win32_PageFileSetting | Where-Object Name -eq $name | Select-Object -First 1
              $properties = @{InitialSize=[uint32]$initialMB;MaximumSize=[uint32]$maxMB}
              if ($setting) {
                Set-CimInstance -InputObject $setting -Property $properties | Out-Null
              } else {
                $properties.Name = $name
                New-CimInstance -ClassName Win32_PageFileSetting -Property $properties | Out-Null
              }
              Write-Host "Requested pagefile on $drive : $initialMB - $maxMB MiB."
            } catch {
              Write-Warning "Pagefile adjustment failed: $_"
            }
          } else {
            Write-Warning 'Insufficient OS disk headroom for a 16 GiB pagefile; retaining current configuration.'
          }
          Get-CimInstance Win32_PageFileSetting | Format-Table Name,InitialSize,MaximumSize
          Get-CimInstance Win32_PageFileUsage | Format-Table Name,AllocatedBaseSize,CurrentUsage,PeakUsage
          # Windows can defer pagefile changes until reboot. No reboot of hosted runner.
          $activeMB = (Get-CimInstance Win32_PageFileUsage | Measure-Object AllocatedBaseSize -Sum).Sum
          if ($activeMB -lt 16384) { Write-Warning 'Active pagefile is below 16 GiB; requested resize may require reboot. Compiler concurrency will be limited regardless.' }
      - name: Validate toolchain and prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio C++ installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path $vcvars)) { throw 'vcvars64.bat not found' }
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
          if (!(Test-Path $sdk)) { throw 'Required Windows SDK 10.0.26100.0 not installed' }
          New-Item -ItemType Directory -Force ThirdParty,Libraries | Out-Null
          $script = @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44 || exit /b 1
          where cl || exit /b 1
          where msbuild || exit /b 1
          call tdesktop\Telegram\build\prepare\win.bat || exit /b 1
          "@
          Set-Content -LiteralPath prepare-ci.cmd -Value $script -Encoding ascii
          cmd.exe /d /c prepare-ci.cmd
          if ($LASTEXITCODE -ne 0) { throw "Dependency preparation failed: $LASTEXITCODE" }
      - name: Configure and compile only (nonfunctional API placeholders)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Deliberately nonfunctional values; compile check only. No sign-in or EXE distribution.
          $script = @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%\tdesktop\Telegram" || exit /b 1
          call configure.bat x64 -D TDESKTOP_API_ID=1 -D TDESKTOP_API_HASH=00000000000000000000000000000000 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%\tdesktop" || exit /b 1
          rem Limit MSBuild project concurrency AND CL.exe translation-unit concurrency.
          rem _CL_ is appended to the compiler command line, overriding inherited /MP.
          set "_CL_=/MP2"
          set "CL_MPCount=2"
          cmake --build out --config Release --target Telegram --parallel 1 -- /p:CL_MPCount=2 /p:PreferredToolArchitecture=x64 || exit /b 1
          "@
          Set-Content -LiteralPath compile-ci.cmd -Value $script -Encoding ascii
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory | Format-List
          Get-CimInstance Win32_PageFileUsage | Format-Table Name,AllocatedBaseSize,CurrentUsage,PeakUsage
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free
          cmd.exe /d /c compile-ci.cmd
          if ($LASTEXITCODE -ne 0) { throw "Compile check failed: $LASTEXITCODE" }
          if (!(Test-Path 'tdesktop/out/Release/AyuGram.exe')) { throw 'Expected AyuGram.exe missing' }
          Write-Host 'Compile check complete. Binary has no usable API credentials and will not be uploaded.'
