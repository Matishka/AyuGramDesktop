name: Privacy Edition Windows compile check
on:
  push:
    branches: ['feat/profile-privacy']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: tdesktop
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Ensure MSVC 14.44 ATL and MFC components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio C++ installation not found' }
          $components = @('Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC')
          $withComponents = & $vswhere -latest -products '*' -requires $components -property installationPath | Select-Object -First 1
          if ($withComponents -ne $vs) {
            $setup = Join-Path $installer 'setup.exe'
            if (!(Test-Path $setup)) { throw 'Visual Studio installer setup.exe not found' }
            $arguments = "modify --installPath `"$vs`" --add $($components[0]) --add $($components[1]) --quiet --norestart"
            $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "Visual Studio component installation failed: $($process.ExitCode)" }
          }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Verify the exact selected toolset, not just the newest VS headers.
          @'
          #include <atlbase.h>
          #include <atlcomcli.h>
          #include <afxwin.h>
          int main() { return 0; }
          '@ | Set-Content -LiteralPath atl-mfc-check.cpp -Encoding ascii
          $script = @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44 || exit /b 1
          cl /nologo /c /EHsc /MT atl-mfc-check.cpp || exit /b 1
          "@
          Set-Content -LiteralPath atl-mfc-check.cmd -Value $script -Encoding ascii
          cmd.exe /d /c atl-mfc-check.cmd
          if ($LASTEXITCODE -ne 0) { throw 'MSVC 14.44 ATL/MFC header compilation failed' }
          Write-Host 'MSVC 14.44 ATL/MFC preflight passed.'
      - name: Validate toolchain and prepare dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio C++ installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (!(Test-Path $vcvars)) { throw 'vcvars64.bat not found' }
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0"
          if (!(Test-Path $sdk)) { throw 'Required Windows SDK 10.0.26100.0 not installed' }
          New-Item -ItemType Directory -Force ThirdParty,Libraries | Out-Null
          $script = @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44 || exit /b 1
          where cl || exit /b 1
          where msbuild || exit /b 1
          call tdesktop\Telegram\build\prepare\win.bat || exit /b 1
          "@
          Set-Content -LiteralPath prepare-ci.cmd -Value $script -Encoding ascii
          cmd.exe /d /c prepare-ci.cmd
          if ($LASTEXITCODE -ne 0) { throw "Dependency preparation failed: $LASTEXITCODE" }
      - name: Expand active pagefile and verify commit headroom
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Only on this disposable hosted runner. Do not change persistent WMI
          # settings or reboot: the previous run proved that those changes were deferred.
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Format-Table DeviceID,Size,FreeSpace
          $drive = $env:SystemDrive
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$drive'"
          $name = "$drive\pagefile.sys"
          $usage = Get-CimInstance Win32_PageFileUsage | Where-Object Name -eq $name | Select-Object -First 1
          $existingMB = if ($usage) { [int]$usage.AllocatedBaseSize } else { 0 }
          $targetMB = [int][Math]::Min(24576, [Math]::Floor($disk.FreeSpace / 1MB) + $existingMB - 12288)
          if ($targetMB -ge 8192 -and $targetMB -gt $existingMB) {
            try {
              # NtCreatePagingFile is a native Windows API. This best-effort attempt
              # is verified against live commit capacity, not registry settings.
              Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Diagnostics;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class CiPagefile {
              [StructLayout(LayoutKind.Sequential)] struct Luid { public uint Low; public int High; }
              [StructLayout(LayoutKind.Sequential)] struct Privilege { public uint Count; public Luid Id; public uint Attributes; }
              [StructLayout(LayoutKind.Sequential)] struct UnicodeString { public ushort Length, MaximumLength; public IntPtr Buffer; }
              [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
              [DllImport("advapi32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern bool LookupPrivilegeValue(string system, string name, out Luid luid);
              [DllImport("advapi32.dll", SetLastError=true)] static extern bool AdjustTokenPrivileges(IntPtr token, bool disable, ref Privilege state, uint length, IntPtr previous, IntPtr returned);
              [DllImport("kernel32.dll", SetLastError=true)] static extern bool CloseHandle(IntPtr handle);
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] static extern uint QueryDosDevice(string device, StringBuilder target, int size);
              [DllImport("ntdll.dll")] static extern int NtCreatePagingFile(ref UnicodeString name, ref long minimum, ref long maximum, uint flags);
              public static void Expand(string drive, long bytes) {
                  IntPtr token;
                  if (!OpenProcessToken(Process.GetCurrentProcess().Handle, 0x28, out token))
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  try {
                      Luid id;
                      if (!LookupPrivilegeValue(null, "SeCreatePagefilePrivilege", out id))
                          throw new Win32Exception(Marshal.GetLastWin32Error());
                      var state = new Privilege { Count=1, Id=id, Attributes=2 };
                      bool ok = AdjustTokenPrivileges(token, false, ref state, 0, IntPtr.Zero, IntPtr.Zero);
                      int error = Marshal.GetLastWin32Error();
                      if (!ok || error != 0) throw new Win32Exception(error);
                      var target = new StringBuilder(1024);
                      if (QueryDosDevice(drive, target, target.Capacity)==0)
                          throw new Win32Exception(Marshal.GetLastWin32Error());
                      string path = target.ToString().Split('\0')[0] + @"\pagefile.sys";
                      IntPtr buffer = Marshal.StringToHGlobalUni(path);
                      try {
                          var name = new UnicodeString { Length=(ushort)(path.Length*2), MaximumLength=(ushort)((path.Length+1)*2), Buffer=buffer };
                          long min=bytes, max=bytes;
                          int status=NtCreatePagingFile(ref name, ref min, ref max, 0);
                          if (status!=0) throw new InvalidOperationException("NtCreatePagingFile status 0x"+unchecked((uint)status).ToString("X8"));
                      } finally { Marshal.FreeHGlobal(buffer); }
                  } finally { CloseHandle(token); }
              }
          }
          '@
              [CiPagefile]::Expand($drive, [long]$targetMB * 1MB)
              Write-Host "Live pagefile expansion requested: $targetMB MiB."
            } catch {
              Write-Warning "Live expansion unavailable: $_. Keeping original pagefile settings."
            }
          } else {
            Write-Warning 'Not enough OS disk headroom for expansion, or current pagefile already meets target.'
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $os | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory | Format-List
          $activeMB = (Get-CimInstance Win32_PageFileUsage | Measure-Object AllocatedBaseSize -Sum).Sum
          Get-CimInstance Win32_PageFileUsage | Format-Table Name,AllocatedBaseSize,CurrentUsage,PeakUsage
          Write-Host "Active pagefile: $activeMB MiB; available commit: $([Math]::Round($os.FreeVirtualMemory / 1MB, 2)) GiB."
          if ($activeMB -lt 8192) { Write-Warning 'Active pagefile below 8 GiB; serial unoptimized compilation is the fallback.' }
          if ($os.FreeVirtualMemory -lt 12582912) { throw 'Less than 12 GiB free commit capacity; refusing to start memory-heavy compilation.' }
      - name: Configure and compile only (nonfunctional API placeholders)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vs) { throw 'Visual Studio not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          # Deliberately nonfunctional values; compile check only. No sign-in or EXE distribution.
          $script = @"
          @echo off
          call "$vcvars" -vcvars_ver=14.44 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%\tdesktop\Telegram" || exit /b 1
          call configure.bat x64 -D TDESKTOP_API_ID=1 -D TDESKTOP_API_HASH=00000000000000000000000000000000 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%\tdesktop" || exit /b 1
          rem Serial compile-only build. Keep Release ABI and definitions, disable costly optimization.
          rem _CL_ appends these switches after the generated compiler options.
          set "_CL_=/MP1 /Od /GL-"
          set "CL_MPCount=1"
          set "UseMultiToolTask=false"
          set "MSBUILDDISABLENODEREUSE=1"
          echo Compiler overrides: %_CL_%
          cmake --build out --config Release --target Telegram --parallel 1 -- /p:CL_MPCount=1 /p:PreferredToolArchitecture=x64 /p:UseMultiToolTask=false /p:BuildInParallel=false /p:WholeProgramOptimization=false /nr:false || exit /b 1
          "@
          Set-Content -LiteralPath compile-ci.cmd -Value $script -Encoding ascii
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory | Format-List
          Get-CimInstance Win32_PageFileUsage | Format-Table Name,AllocatedBaseSize,CurrentUsage,PeakUsage
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free
          $freeKiB = (Get-CimInstance Win32_OperatingSystem).FreeVirtualMemory
          if ($freeKiB -lt 12582912) { throw 'Less than 12 GiB free commit capacity before compilation.' }
          cmd.exe /d /c compile-ci.cmd
          if ($LASTEXITCODE -ne 0) { throw "Compile check failed: $LASTEXITCODE" }
          if (!(Test-Path 'tdesktop/out/Release/AyuGram.exe')) { throw 'Expected AyuGram.exe missing' }
          Write-Host 'Compile check complete. Binary has no usable API credentials and will not be uploaded.'
